<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>loopback: compile and run contest code in your browser</title>
    <meta name="description" content="Compile and run C, C++, Java, Python, JavaScript, TypeScript, Go, Ruby and PHP in your browser, on your own CPU. Check your Codeforces solution against sample tests without opening an online compiler." />
    <meta name="theme-color" content="#0e2233" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <header class="bar">
      <h1>loopback</h1>
      <p class="tag">Check your solution against the samples without leaving the tab. Runs on your own machine.</p>
      <label class="lang">
        Language
        <select id="lang"></select>
      </label>
      <button type="button" id="share">Copy share link</button>
    </header>

    <main class="work">
      <section class="editor" aria-label="Code editor"><div id="editor"></div></section>

      <section class="tests" aria-labelledby="tests-title">
        <div class="tests-head">
          <h2 id="tests-title">Tests</h2>
          <kbd id="run-hint">Ctrl + Enter</kbd>
          <button type="button" id="run-all" class="primary">Run all tests</button>
        </div>
        <pre id="compile-error" hidden></pre>
        <ol id="test-list"></ol>
        <button type="button" id="add-test">Add test</button>
      </section>
    </main>

    <footer id="status" role="status" aria-live="polite"></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
