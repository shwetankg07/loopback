<!doctype html>
<!-- Java runs here on CheerpJ. CheerpJ executes Java on the page's main thread, so instead of isolating it we compile
     every program through java/loopback/Compile.java, which puts a time check in each loop body. A stuck program
     stops itself at the time limit. The helper classes ship prebuilt in java-harness.jar (npm run build:java). -->
<meta charset="utf-8">
<script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
<pre id="console" hidden></pre>
<script type="module">
  const cons = document.getElementById("console");
  const app = (path) => "/app" + new URL(path, document.baseURI).pathname;
  const TOOLS = app("vendor/java/tools.jar");
  const HARNESS = app("java-harness.jar");

  const text = async (path) => { try { return await (await cjFileBlob(path)).text(); } catch { return ""; } };
  let dir = "", mainClass = "", seq = 0;

  async function compile(code) {
    const name = (code.match(/public\s+(?:final\s+)?class\s+(\w+)/) || code.match(/class\s+(\w+)[^{]*\{[\s\S]*?static\s+void\s+main\s*\(/) || [, "Main"])[1];
    const pkg = (code.match(/^\s*package\s+([\w.]+)\s*;/m) || [])[1];
    dir = `/files/p${++seq}/`;
    await cheerpjRunMain("loopback.Harness", HARNESS, "mkdir", dir);
    cheerpOSAddStringFile(`/str/${name}.java`, code);
    cons.textContent = "";
    await cheerpjRunMain("loopback.Compile", `${TOOLS}:${HARNESS}`, `/str/${name}.java`, dir, HARNESS);
    mainClass = pkg ? `${pkg}.${name}` : name;
    if ((await text("/files/compile.txt")) === "ok") return {};
    return { compileError: cons.textContent.replaceAll(`/str/${name}.java`, `${name}.java`) || "javac failed without a message" };
  }

  async function run(stdin, limit, timeoutMs) {
    cheerpOSAddStringFile("/str/stdin.txt", stdin);
    cons.textContent = "";
    const t = performance.now();
    await cheerpjRunMain("loopback.Harness", HARNESS, "run", dir, mainClass, String(timeoutMs));
    const ms = performance.now() - t;
    let stdout = await text("/files/stdout.txt");
    let stderr = cons.textContent;
    let status = (await text("/files/status.txt")) || "runtime_error";
    // CheerpJ reports very deep recursion as an ArithmeticException with a huge trace.
    if (/ArithmeticException/.test(stderr) && (stderr.match(/\n\s*at /g) || []).length > 100) {
      stderr = "Stack overflow: recursion is too deep for the browser JVM (under 10k frames). Use an explicit stack.";
    } else {
      stderr = stderr.split("\n").filter((l) => !/at (sun\.reflect|java\.lang\.reflect|loopback\.)/.test(l)).slice(0, 30).join("\n");
    }
    if (stdout.length > limit) { stdout = stdout.slice(0, limit); stderr += "\nOutput limit exceeded (1 MB)"; status = "runtime_error"; }
    return { status, stdout, stderr, ms };
  }

  const ready = cheerpjInit({ version: 8, status: "none" });

  // ponytail: no origin allowlist — the frame only runs code in the visitor's own browser, which any site could already do with CheerpJ.
  let queue = Promise.resolve();
  addEventListener("message", (e) => {
    if (e.source !== parent) return;
    const { id, op, code, stdin, limit, timeoutMs } = e.data;
    queue = queue.then(async () => {
      let res;
      try {
        await ready;
        res = op === "compile" ? await compile(code) : await run(stdin, limit, timeoutMs);
      } catch (err) {
        res = { crash: String(err?.message || err) };
      }
      parent.postMessage({ id, ...res }, e.origin);
    });
  });
  parent.postMessage({ ready: true }, "*");
</script>
